name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: rm package-lock.json && npm install --no-audit --no-fund  # lockfile pins internal PayPal artifactory
      - run: npm run format:check
      - run: npm run lint:md
